  <script>
    /* Cute Audio Synthesizer (Web Audio API) */
    class CuteAudioPlayer {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      initCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      }
      playTone(freq, duration = 0.15, type = 'sine', gainVal = 0.12) {
        if (!this.enabled) return;
        try {
          this.initCtx();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio error:", e);
        }
      }
      playCorrectChime() {
        if (!this.enabled) return;
        this.playTone(523.25, 0.12, 'triangle', 0.14);
        setTimeout(() => this.playTone(659.25, 0.12, 'triangle', 0.14), 70);
        setTimeout(() => this.playTone(783.99, 0.14, 'triangle', 0.14), 140);
        setTimeout(() => this.playTone(1046.50, 0.22, 'triangle', 0.16), 210);
      }
      playWrongBuzz() {
        if (!this.enabled) return;
        this.playTone(280, 0.18, 'sawtooth', 0.12);
        setTimeout(() => this.playTone(200, 0.24, 'sawtooth', 0.14), 100);
      }
      playClick() {
        if (!this.enabled) return;
        this.playTone(600, 0.05, 'sine', 0.07);
      }
      playFanfare() {
        if (!this.enabled) return;
        const notes = [440, 554, 659, 880, 1108];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.2, 'triangle', 0.14), idx * 80);
        });
      }
    }

      },
      {

        "answers": [

    const finalAccuracy = document.getElementById('finalAccuracy');

    function startQuiz() {
      currentIndex = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      userAnswersHistory = [];

      resultsView.classList.add('hidden');
      playView.classList.remove('hidden');

      renderQuestion();
    }

    function renderQuestion() {
      if (currentIndex >= QUIZ_QUESTIONS.length) {
        showResults();
        return;
      }

      isAnswered = false;
      const q = QUIZ_QUESTIONS[currentIndex];

      currentQNum.textContent = currentIndex + 1;
      totalQNum.textContent = QUIZ_QUESTIONS.length;
      currentStreak.textContent = streak;
      currentScore.textContent = score;

      const progress = ((currentIndex) / QUIZ_QUESTIONS.length) * 100;
      quizProgressBar.style.width = `${progress}%`;

      promptText.textContent = q.question;
      ttsButton.onclick = () => speakPrompt(q.question);

      questionDisplayCard.classList.remove('correct-bounce', 'wrong-shake');

      choicesGrid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

      q.answers.forEach((ans, i) => {
        const pastelTheme = PASTEL_OPTION_CONFIGS[i % PASTEL_OPTION_CONFIGS.length];
        const btn = document.createElement('button');

        btn.className = `play-option-btn w-full p-4 sm:p-5 rounded-3xl border-2 font-semibold text-xs sm:text-sm text-left flex items-center justify-between transition-all duration-150 active:scale-[0.98] ${pastelTheme.class}`;
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="play-opt-badge w-8 h-8 sm:w-9 sm:h-9 rounded-2xl font-bold text-xs sm:text-sm flex items-center justify-center shrink-0 shadow-inner">
              ${letters[i] || '•'}
            </span>
            <span class="choice-text leading-snug">${escapeHtml(ans.text)}</span>
          </div>
          <span class="choice-tag text-xs font-bold opacity-0 transition-opacity"></span>
        `;

        btn.onclick = () => handlePlayerChoice(ans, btn, q);
        choicesGrid.appendChild(btn);
      });

      nextBtn.classList.add('hidden');
    }

    function handlePlayerChoice(chosenAns, clickedBtn, questionObj) {
      if (isAnswered) return;
      isAnswered = true;

      const isCorrect = chosenAns.isCorrect;
      const allButtons = choicesGrid.querySelectorAll('.play-option-btn');

      userAnswersHistory.push({
        prompt: questionObj.question,
        userSelection: chosenAns.text,
        correctAnswer: (questionObj.answers.find(a => a.isCorrect) || {}).text || '',
        isCorrect: isCorrect
      });

      if (isCorrect) {
        audioPlayer.playCorrectChime();
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        score += 100 + (streak * 20);

        questionDisplayCard.classList.add('correct-bounce');

        clickedBtn.classList.add('play-opt-correct');
        const tag = clickedBtn.querySelector('.choice-tag');
        tag.textContent = '✨ Correct!';
        tag.classList.remove('opacity-0');
      } else {
        audioPlayer.playWrongBuzz();
        streak = 0;

        questionDisplayCard.classList.add('wrong-shake');

        clickedBtn.classList.add('play-opt-wrong');
        const tag = clickedBtn.querySelector('.choice-tag');
        tag.textContent = '✕ Incorrect';
        tag.classList.remove('opacity-0');

        questionObj.answers.forEach((ans, idx) => {
          if (ans.isCorrect && allButtons[idx]) {
            allButtons[idx].classList.add('play-opt-correct');
            const cTag = allButtons[idx].querySelector('.choice-tag');
            cTag.textContent = '✓ Correct';
            cTag.classList.remove('opacity-0');
          }
        });
      }

      currentStreak.textContent = streak;
      currentScore.textContent = score;

      allButtons.forEach(btn => btn.disabled = true);

      const isLastQuestion = (currentIndex === QUIZ_QUESTIONS.length - 1);
      if (isLastQuestion) {
        nextBtnText.textContent = "See Results";
        nextBtnIcon.textContent = "🌟";
      } else {
        nextBtnText.textContent = "Next Question";
        nextBtnIcon.textContent = "➔";
      }

      nextBtn.classList.remove('hidden');
    }

    function speakPrompt(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function showResults() {
      audioPlayer.playFanfare();

      playView.classList.add('hidden');
      resultsView.classList.remove('hidden');

      const total = userAnswersHistory.length;
      const correctCount = userAnswersHistory.filter(a => a.isCorrect).length;
      const missedCount = total - correctCount;
      const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      finalAccuracy.textContent = `${accuracy}%`;
      finalCorrect.textContent = correctCount;
      finalMissed.textContent = missedCount;
      finalStreak.textContent = maxStreak;

      if (accuracy >= 80) {
        resultEmoji.textContent = '🌟';
        resultHeading.textContent = 'Super Duper Score!';
        resultSubheading.textContent = `You got ${correctCount} out of ${total} correct! Outstanding job!`;
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 } });
        }
      } else if (accuracy >= 50) {
        resultEmoji.textContent = '🌸';
        resultHeading.textContent = 'Nice Job!';
        resultSubheading.textContent = `You scored ${correctCount}/${total}. Keep blooming!`;
      } else {
        resultEmoji.textContent = '🧸';
        resultHeading.textContent = 'Good Practice!';
        resultSubheading.textContent = `You scored ${correctCount}/${total}. Try again to master it!`;
      }

      renderBreakdown();
    }

    function renderBreakdown() {
      breakdownList.innerHTML = '';
      userAnswersHistory.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = `p-4 rounded-2xl border-2 text-xs sm:text-sm flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${
          item.isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'
        }`;

        row.innerHTML = `
          <div>
            <div class="font-bold text-slate-800 mb-0.5 whitespace-pre-wrap">#${idx + 1} ${escapeHtml(item.prompt)}</div>
            <div class="${item.isCorrect ? 'text-emerald-700' : 'text-rose-700'} font-medium">
              <span>Your answer: <strong>${escapeHtml(item.userSelection)}</strong></span>
              ${!item.isCorrect ? `<span class="ml-2 font-bold text-emerald-700">| Correct: <strong>${escapeHtml(item.correctAnswer)}</strong></span>` : ''}
            </div>
          </div>
          <span class="self-end sm:self-center px-3 py-1 rounded-xl font-bold text-xs ${item.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
            ${item.isCorrect ? 'Correct ⭐' : 'Missed ✖'}
          </span>
        `;
        breakdownList.appendChild(row);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    playAgainBtn.addEventListener('click', () => {
      audioPlayer.playClick();
      startQuiz();
    });

    nextBtn.addEventListener('click', () => {
      audioPlayer.playClick();
      currentIndex++;
      renderQuestion();
    });

    soundToggleBtn.addEventListener('click', () => {
      audioPlayer.enabled = !audioPlayer.enabled;
      soundIcon.textContent = audioPlayer.enabled ? '🔔' : '🔕';
      soundText.textContent = audioPlayer.enabled ? 'Sound: ON' : 'Sound: OFF';
      if (audioPlayer.enabled) audioPlayer.playClick();
    });

    // Start immediately on page load
    window.addEventListener('DOMContentLoaded', () => {
      startQuiz();
    });
  </script>

</body>
</html>
